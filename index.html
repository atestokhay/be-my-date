<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeMyDate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h3>made by Ates</h3>
    <div class="container" id="proposal-screen">
        <img src="https://media1.tenor.com/m/MKkJWYigjycAAAAd/cute-cat-cat-cute.gif" alt="Cute Cat" id="cat-gif">
        
        <h1>Will You Date Me?</h1>
        
        <button id="yes-btn">Yes! 💖</button>
        <button id="no-btn">No 🏃‍♀️</button>
    </div>

    <div class="container" id="detail-screen">
        <h2>What Shall We Eat? 😋</h2>
        
        <div class="food-options">
            
            <button class="food-card" id="selection-sushi">
                <img src="https://i.pinimg.com/736x/b9/f1/d6/b9f1d68b1357efdecaa83807ffefdae3.jpg" alt="Sushi">
                <p>Sushi</p>
            </button>

            <button class="food-card" id="selection-pizza">
                <img src="https://static.vecteezy.com/system/resources/previews/009/955/768/non_2x/pixel-art-pizza-with-pepperoni-and-cheese-8bit-game-icon-on-white-background-vector.jpg" alt="Pizza">
                <p>Pizza</p>
            </button>

            <button class="food-card" id="selection-burger">
                <img src="https://static.vecteezy.com/system/resources/previews/009/877/912/non_2x/pixel-art-burger-and-soda-x-burger-fast-food-icon-for-8bit-game-on-white-background-vector.jpg" alt="Burger">
                <p>Burger</p>
            </button>

            <button class="food-card" id="selection-pasta">
               <img src="https://i.pinimg.com/736x/2a/ae/8d/2aae8df1cf7c40283df15673358b6e49.jpg" alt="Pasta">
               <p>Pasta</p>
            </button>

        </div>
    </div>

    <div class="container" id="calendar-screen">
        <h2>When? 📅</h2>
        
        <div id="date-options" class="option-group"></div>

        <h2>At What Time? ⏰</h2>
        <div id="time-options" class="option-group">
            <button class="time-card time-btn">18:00</button>
            <button class="time-card time-btn">19:00</button>
            <button class="time-card time-btn">20:00</button>
            <button class="time-card time-btn">21:00</button>
        </div>
        
        <button id="confirm-btn" style="display: none;">Complete Proposal 💌</button>
    </div>
    
<script src="script.js"></script>
</body>
</html>
